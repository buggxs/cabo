# Static analysis configuration. Three tools read this file:
#
#   flutter analyze        -> `analyzer` and `linter` sections
#   dart run custom_lint   -> `custom_lint` section (rules live in tools/cabo_lints)
#   bloc lint .            -> `bloc` section
include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # Generated files are build artifacts and never hand-edited.
  exclude:
    - "**/*.g.dart"
    - "**/*.mocks.dart"
    - "lib/l10n/app_localizations*.dart"
    - "lib/firebase_options.dart"

linter:
  rules:
    # Types
    always_specify_types: true
    always_declare_return_types: true

    # Immutability
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # Async and error handling
    unawaited_futures: true
    discarded_futures: true
    avoid_catches_without_on_clauses: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_dynamic_calls: true

    # Conventions the code base already follows
    always_use_package_imports: true
    prefer_single_quotes: true

custom_lint:
  rules:
    - bool_prefix
    - max_widgets_per_file
    - max_method_length:
        max_lines: 50
        max_build_lines: 80
    - restricted_doc_comments
    - use_navigation_service
    - layer_boundaries
    - no_flutter_ui_in_domain

bloc:
  rules:
    - avoid_flutter_imports
    - avoid_public_bloc_methods
    - avoid_public_fields
    - prefer_file_naming_conventions
    - prefer_void_public_cubit_methods
